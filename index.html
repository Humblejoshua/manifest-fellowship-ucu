<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Manifest Fellowship UCU</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/jpeg" href="assets/logo.jpeg">
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="active">
  <div class="login-container">
    <div class="login-logo">
      <img src="assets/logo.jpeg" alt="Manifest" onerror="this.style.display='none'">
    </div>
    <div class="login-title">Sign in to Manifest<br>Fellowship UCU</div>
    <div id="login-error" class="login-error">Invalid username or password</div>
    <form id="login-form">
      <div class="login-field">
        <input type="text" id="username" placeholder="Username" autocomplete="username" required>
      </div>
      <div class="login-field">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="login-btn">Sign in</button>
    </form>
    <div class="login-hint">
      Demo accounts
      <span>admin / admin &middot; leader / leader123 &middot; minister / minister123</span>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- Header -->
  <header class="app-header" id="app-header">
    <div class="header-left">
      <img src="assets/logo.jpeg" alt="M" class="header-logo" onerror="this.style.display='none'">
      <span class="header-title" id="header-title">Dashboard</span>
    </div>
    <div class="header-actions">
      <button class="header-btn" id="notif-btn" onclick="Views.enableNotifications()" title="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
    </div>
  </header>

  <!-- Content -->
  <main class="main-content">
    <div class="page-content" id="page-content"></div>
  </main>

  <!-- Bottom Tab Bar -->
  <nav class="tab-bar" id="tab-bar">
    <button class="tab-item active" data-tab="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span class="tab-label">Home</span>
      <div class="tab-indicator"></div>
    </button>
    <button class="tab-item" data-tab="members">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="tab-label">Members</span>
      <div class="tab-indicator"></div>
    </button>
    <button class="tab-item" data-tab="attendance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span class="tab-label">Attendance</span>
      <div class="tab-indicator"></div>
    </button>
    <button class="tab-item" data-tab="followup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span class="tab-label">Follow-up</span>
      <div class="tab-indicator"></div>
    </button>
    <button class="tab-item" data-tab="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      <span class="tab-label">More</span>
      <div class="tab-indicator"></div>
    </button>
  </nav>
</div>

<!-- Toast -->
<div class="toast-container" id="toast-container"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-drawer">
    <div class="modal-handle"></div>
    <h3 id="modal-title">Modal</h3>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
